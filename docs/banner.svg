<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="RickAndMortyKit: a Swift client for the Rick and Morty API with a SwiftUI app for iPhone and iPad" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d10"/>
      <stop offset="1" stop-color="#0d1a1c"/>
    </linearGradient>
    <radialGradient id="portal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0b2a14"/>
      <stop offset="0.35" stop-color="#2f9e4a"/>
      <stop offset="0.75" stop-color="#6bee78"/>
      <stop offset="1" stop-color="#6bee78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6bee78" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6bee78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162327"/>
      <stop offset="1" stop-color="#101a1d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="560" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="64" cy="48" r="1.6" opacity="0.7"/>
    <circle cx="190" cy="120" r="1.2" opacity="0.5"/>
    <circle cx="320" cy="36" r="1.4" opacity="0.6"/>
    <circle cx="452" cy="96" r="1" opacity="0.5"/>
    <circle cx="610" cy="30" r="1.6" opacity="0.7"/>
    <circle cx="700" cy="520" r="1.2" opacity="0.5"/>
    <circle cx="120" cy="500" r="1.4" opacity="0.6"/>
    <circle cx="420" cy="530" r="1" opacity="0.5"/>
    <circle cx="560" cy="470" r="1.3" opacity="0.6"/>
    <circle cx="1220" cy="40" r="1.5" opacity="0.7"/>
    <circle cx="1240" cy="520" r="1.2" opacity="0.5"/>
    <circle cx="760" cy="70" r="1.1" opacity="0.5"/>
  </g>

  <!-- portal -->
  <circle cx="1010" cy="280" r="300" fill="url(#glow)"/>
  <circle cx="1010" cy="280" r="215" fill="url(#portal)"/>
  <g fill="none" stroke="#0b2a14" stroke-linecap="round" opacity="0.75">
    <path d="M 1010 110 A 170 170 0 0 1 1180 280" stroke-width="7"/>
    <path d="M 1150 360 A 160 160 0 0 1 900 400" stroke-width="6"/>
    <path d="M 860 300 A 150 150 0 0 1 960 140" stroke-width="5"/>
    <path d="M 1010 170 A 110 110 0 0 1 1110 300" stroke-width="5"/>
    <path d="M 1080 360 A 100 100 0 0 1 920 320" stroke-width="4"/>
    <path d="M 940 250 A 80 80 0 0 1 1030 205" stroke-width="4"/>
    <path d="M 1050 260 A 45 45 0 0 1 1000 320" stroke-width="3"/>
  </g>

  <!-- character card -->
  <g transform="translate(840 150)">
    <rect width="230" height="270" rx="22" fill="url(#card)" stroke="#6bee78" stroke-opacity="0.25"/>
    <rect x="14" y="14" width="202" height="160" rx="14" fill="#1c3a2a"/>
    <!-- abstract avatar -->
    <circle cx="115" cy="80" r="40" fill="#8fd8f0"/>
    <circle cx="100" cy="74" r="11" fill="#ffffff"/>
    <circle cx="130" cy="74" r="11" fill="#ffffff"/>
    <circle cx="102" cy="75" r="4.5" fill="#0b1a1c"/>
    <circle cx="128" cy="75" r="4.5" fill="#0b1a1c"/>
    <path d="M 104 98 Q 115 106 126 98" fill="none" stroke="#0b1a1c" stroke-width="3" stroke-linecap="round"/>
    <path d="M 70 174 Q 115 120 160 174 Z" fill="#5a63e8"/>
    <rect x="24" y="24" width="72" height="22" rx="11" fill="#000000" fill-opacity="0.6"/>
    <circle cx="38" cy="35" r="5" fill="#55db6b"/>
    <text x="49" y="40" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Alive</text>
    <text x="18" y="204" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Character #1</text>
    <text x="18" y="228" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#9aa7ab">Human · Earth (C-137)</text>
    <text x="18" y="252" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#6bee78">S01E01 … S05E10</text>
  </g>

  <!-- title -->
  <text x="72" y="210" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff">RickAndMorty<tspan fill="#6bee78">Kit</tspan></text>
  <text x="74" y="262" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#c3cfd2">A Swift client for the Rick and Morty API,</text>
  <text x="74" y="296" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#c3cfd2">with a SwiftUI app for iPhone and iPad.</text>

  <!-- pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="74" y="336" width="128" height="38" rx="19" fill="#6bee78" fill-opacity="0.14" stroke="#6bee78" stroke-opacity="0.5"/>
    <text x="138" y="361" text-anchor="middle" fill="#d9fbe0">Characters</text>
    <rect x="214" y="336" width="114" height="38" rx="19" fill="#6bee78" fill-opacity="0.14" stroke="#6bee78" stroke-opacity="0.5"/>
    <text x="271" y="361" text-anchor="middle" fill="#d9fbe0">Episodes</text>
    <rect x="340" y="336" width="120" height="38" rx="19" fill="#6bee78" fill-opacity="0.14" stroke="#6bee78" stroke-opacity="0.5"/>
    <text x="400" y="361" text-anchor="middle" fill="#d9fbe0">Locations</text>
    <rect x="472" y="336" width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="520" y="361" text-anchor="middle" fill="#c3cfd2">Filters</text>
    <rect x="580" y="336" width="90" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="625" y="361" text-anchor="middle" fill="#c3cfd2">Paging</text>
  </g>

  <text x="74" y="430" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19" fill="#9aa7ab">for try await episode in api.allEpisodes() { … }</text>
  <text x="74" y="470" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#66767a">Swift 6 · async/await · iOS and iPadOS 17+ · Unofficial; data from rickandmortyapi.com</text>
</svg>
